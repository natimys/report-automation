[project]
name = "college-report-mvp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "python-multipart>=0.0.9", "lxml>=5.0", "pillow>=10.0"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
